<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tabblad-icoon in de stijl van het MDE Automation-logo:
       zwarte brede MDE-letters, met de rode 'AUTOMATION'-balk eronder. -->
  <rect width="64" height="64" rx="10" fill="#ffffff"/>
  <text x="32" y="40" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif" font-weight="900"
        font-size="30" fill="#111111"
        textLength="56" lengthAdjust="spacingAndGlyphs">MDE</text>
  <rect x="4" y="47" width="56" height="8" fill="#ED1C24"/>
</svg>
