<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offertedocument</title>
<!--
  Offertedocument (wens gebruiker 20-11-2026): een offerte uit blokken, met prijstabellen die aan de calculatie gekoppeld
  blijven. Draait in een iframe op Components/Pages/OfferteDocumentPagina.razor en haalt en bewaart via
  offertedocument/api/<offerte> (Services/OfferteDocumentApi.cs).

  - Het vel gebruikt de opmaak van de PDF zelf (de app stuurt de stijl mee), dus wat je ziet is wat de klant krijgt.
  - Tekst, kop en plaatje bewerk je hier. Prijstabel, voorwaarden en ondertekening maakt de app op (één plek die de
    opmaak bepaalt: OfferteDocumentService); hier kies je alleen welk deel van de calculatie en hoe.
  - Alles van dit scherm zelf heet ed-…, zodat het niet botst met de klassen van de PDF (kop, klein, r, logo …).
-->
<style id="docstijl"></style>
<style>
  :root { --ed-vlak: #eef1f5; --ed-balk: #ffffff; --ed-lijn: #d5dbe3; --ed-tekst: #1c2430; --ed-zacht: #66707d; --ed-accent: #1f6feb; --ed-rood: #c0392b; --ed-geel: #fff6d6; }
  html[data-theme="dark"] { --ed-vlak: #12171e; --ed-balk: #1a212b; --ed-lijn: #334051; --ed-tekst: #e6ebf2; --ed-zacht: #9aa6b5; --ed-accent: #6ea8ff; --ed-rood: #ff7b6b; --ed-geel: #3a3210; }
  /* Alleen het vel schuift (wens gebruiker 20-11-2026): de balk, de meldingen en het paneel staan vast, het scherm zelf
     heeft geen schuifbalk. */
  html, body { height: 100%; }
  body { background: var(--ed-vlak) !important; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
  #meldingen { flex: none; }
  #inhoud { flex: 1; min-height: 0; overflow: auto; }
  .ed-balk { flex: none; z-index: 30; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 14px;
             background: var(--ed-balk); border-bottom: 1px solid var(--ed-lijn); color: var(--ed-tekst); font: 13px 'Segoe UI', Arial, sans-serif; }
  .ed-balk[hidden] { display: none; }
  .ed-balk .ed-groei { flex: 1; }
  .ed-chip { padding: 2px 9px; border-radius: 10px; font-size: 12px; border: 1px solid var(--ed-lijn); white-space: nowrap; }
  .ed-chip.vast { background: #1f8f4d; border-color: #1f8f4d; color: #fff; }
  .ed-opslag { color: var(--ed-zacht); font-size: 12px; }
  .ed-opslag.fout { color: var(--ed-rood); font-weight: 600; }
  .ed-knop { font: 13px 'Segoe UI', Arial, sans-serif; padding: 5px 11px; border: 1px solid var(--ed-lijn); border-radius: 6px; background: var(--ed-balk);
             color: var(--ed-tekst); cursor: pointer; white-space: nowrap; }
  .ed-knop:hover:not(:disabled) { border-color: var(--ed-accent); }
  .ed-knop:disabled { opacity: .5; cursor: default; }
  .ed-knop.hoofd { background: var(--ed-accent); border-color: var(--ed-accent); color: #fff; }
  html[data-theme="dark"] .ed-knop.hoofd { color: #0b1220; }
  .ed-meld { margin: 8px auto 2px; max-width: 210mm; padding: 8px 12px; border-radius: 6px; font: 13px 'Segoe UI', Arial, sans-serif;
             background: var(--ed-geel); color: var(--ed-tekst); border: 1px solid var(--ed-lijn); }
  .ed-meld.fout { border-color: var(--ed-rood); color: var(--ed-rood); }
  .ed-velden { display: none; flex-basis: 100%; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--ed-zacht); font-size: 12px; }
  .ed-velden.open { display: flex; }
  .ed-velden button { font: 12px Consolas, monospace; padding: 2px 7px; border: 1px solid var(--ed-lijn); border-radius: 5px; background: transparent; color: var(--ed-tekst); cursor: pointer; }

  .ed-leeg { max-width: 640px; margin: 40px auto; padding: 22px 26px; background: var(--ed-balk); border: 1px solid var(--ed-lijn); border-radius: 10px;
             color: var(--ed-tekst); font: 14px/1.5 'Segoe UI', Arial, sans-serif; }
  .ed-leeg h2 { all: unset; display: block; font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .ed-leeg p { margin: 0 0 12px; }
  .ed-leeg a { color: var(--ed-accent); }

  /* het vel: A4-breed, altijd wit papier (ook in het donkere thema) */
  .ed-blad { width: 210mm; max-width: calc(100vw - 24px); min-height: 297mm; margin: 16px auto 80px; padding: 14mm 15mm 20mm; background: #fff; color: #222;
             box-shadow: 0 2px 14px rgba(0, 0, 0, .18); font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5pt; position: relative; }
  .ed-vast { position: relative; }
  .ed-blok { position: relative; border-radius: 3px; outline: 1px dashed transparent; outline-offset: 3px; }
  /* Opmaakmodus (wens gebruiker 20-11-2026: "onrustig als je er met de muis overheen gaat"): zonder die modus verschijnt
     er niets als je over het vel beweegt en typ je gewoon in de tekst. Met de knop Opmaak zie je de randen van alle
     blokken en de + ertussen; de knoppen en instellingen horen bij het blok waarop je klikt, niet bij de muis. */
  .ed-opmaak .ed-blok { outline-color: #c3d2ec; }
  .ed-opmaak .ed-blok.ed-gekozen { outline: 2px solid #1f6feb; }
  .ed-blok.ed-sleep { opacity: .35; }
  .ed-blok.ed-voor::before, .ed-blok.ed-na::after { content: ''; position: absolute; left: -4px; right: -4px; height: 3px; background: #1f6feb; border-radius: 2px; z-index: 5; }
  .ed-blok.ed-voor::before { top: -6px; } .ed-blok.ed-na::after { bottom: -6px; }
  .ed-strip { position: absolute; right: 0; top: -27px; z-index: 10; display: none; gap: 2px; padding: 2px; background: #fff; border: 1px solid #c9d3df;
              border-radius: 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, .15); font: 12px 'Segoe UI', Arial, sans-serif; align-items: center; }
  .ed-opmaak .ed-blok.ed-gekozen > .ed-strip { display: flex; }
  .ed-strip button, .ed-strip .ed-greep { all: unset; min-width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 4px; cursor: pointer; color: #333; font-size: 13px; padding: 0 2px; }
  .ed-strip button:hover { background: #e8eef8; }
  .ed-strip .ed-greep { cursor: grab; color: #888; }
  .ed-strip .ed-sep { width: 1px; height: 16px; background: #d5dbe3; margin: 0 2px; }
  .ed-strip .ed-soort { color: #888; font-size: 11px; padding: 0 6px 0 4px; white-space: nowrap; }
  .ed-inst { display: none; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 4mm 0 -2mm; padding: 5px 8px; background: #f1f5fb; border: 1px solid #c9d3df;
             border-radius: 6px; font: 12px 'Segoe UI', Arial, sans-serif; color: #333; }
  .ed-opmaak .ed-blok.ed-gekozen > .ed-inst { display: flex; }
  .ed-inst select { font: 12px 'Segoe UI', Arial, sans-serif; padding: 2px 4px; max-width: 260px; }
  .ed-inst label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  .ed-inst .ed-koppel { color: #1f6feb; font-weight: 600; }
  [contenteditable]:focus { outline: none; }
  .ed-bewerk [contenteditable]:empty::before { content: attr(data-leeg); color: #aaa; }
  .ed-pagina { margin: 6mm 0 0; border-top: 2px dashed #b9c2cf; text-align: center; color: #8894a3; font: 11px 'Segoe UI', Arial, sans-serif; padding-top: 2px; }
  .ed-tussen { position: relative; height: 10px; margin: 0 -6px; }
  .ed-tussen > button { all: unset; position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 22px; height: 22px; line-height: 20px; text-align: center;
                        border-radius: 50%; background: #1f6feb; color: #fff; font: 600 16px 'Segoe UI', Arial, sans-serif; cursor: pointer; opacity: 0; z-index: 8; }
  .ed-tussen > button { visibility: hidden; }
  .ed-opmaak .ed-tussen > button { visibility: visible; opacity: .55; }
  .ed-opmaak .ed-tussen > button:hover, .ed-opmaak .ed-tussen > button:focus, .ed-opmaak .ed-tussen.ed-menu-open > button { opacity: 1; }
  .ed-knop.aan { border-color: var(--ed-accent); color: var(--ed-accent); font-weight: 600; }
  .ed-menu { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 20; display: flex; flex-wrap: wrap; gap: 4px; width: max-content; max-width: 170mm;
             padding: 6px; background: #fff; border: 1px solid #c9d3df; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .2); }
  .ed-menu button { all: unset; padding: 5px 10px; border-radius: 5px; cursor: pointer; font: 12.5px 'Segoe UI', Arial, sans-serif; color: #222; border: 1px solid #e1e6ee; }
  .ed-menu button:hover { background: #e8eef8; border-color: #9db7e6; }
  .ed-strip select { font: 11px 'Segoe UI', Arial, sans-serif; padding: 1px 2px; border: 1px solid #d5dbe3; border-radius: 4px; background: #fff; color: #333; }
  .ed-bewerk .eigen td:focus, .ed-bewerk .eigen th:focus { background: #eef4ff; }
  /* het vel met links het paneel van de calculatie (stap 3): daaruit sleep je een deel naar het document */
  .ed-werk { display: flex; align-items: flex-start; gap: 14px; padding: 0 0 0 12px; height: 100%; box-sizing: border-box; }
  .ed-schuif { flex: 1; min-width: 0; height: 100%; overflow: auto; }
  .ed-boom { flex: none; width: 250px; max-height: calc(100% - 28px); box-sizing: border-box; overflow: auto; margin-top: 16px; padding: 10px 8px;
             background: var(--ed-balk); border: 1px solid var(--ed-lijn); border-radius: 8px; color: var(--ed-tekst); font: 12.5px 'Segoe UI', Arial, sans-serif; }
  .ed-boom-titel { font-weight: 600; font-size: 13px; padding: 0 6px; }
  .ed-boom-uitleg { color: var(--ed-zacht); font-size: 11.5px; line-height: 1.35; padding: 3px 6px 8px; }
  .ed-boom-item { display: flex; gap: 8px; align-items: baseline; padding: 3px 6px; border-radius: 5px; cursor: grab; user-select: none; }
  .ed-boom-item:hover { background: rgba(31, 111, 235, .14); }
  .ed-boom-naam { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-boom-bedrag { margin-left: auto; color: var(--ed-zacht); white-space: nowrap; font-size: 11.5px; }
  .ed-blad.ed-doel { outline: 2px dashed #1f6feb; outline-offset: 4px; }
  .ed-velden input[type=text] { font: 13px 'Segoe UI', Arial, sans-serif; padding: 3px 7px; border: 1px solid var(--ed-lijn); border-radius: 5px; background: var(--ed-balk); color: var(--ed-tekst); width: 240px; }
  .ed-velden label { display: inline-flex; gap: 4px; align-items: center; color: var(--ed-tekst); }
  .ed-keuze { display: grid; gap: 4px; margin: 0 0 14px; }
  .ed-keuze label { display: flex; gap: 8px; align-items: baseline; padding: 6px 9px; border: 1px solid var(--ed-lijn); border-radius: 6px; cursor: pointer; }
  .ed-keuze label:has(input:checked) { border-color: var(--ed-accent); }
  .ed-keuze small { color: var(--ed-zacht); }
  .ed-keuze button { all: unset; margin-left: auto; cursor: pointer; color: var(--ed-zacht); padding: 0 4px; }
  .ed-keuze button:hover { color: var(--ed-rood); }
  .ed-einde { margin-top: 8mm; text-align: center; }
  @media print { .ed-balk, .ed-strip, .ed-inst, .ed-tussen, .ed-einde, .ed-boom { display: none !important; } }
</style>
</head>
<body>
<div class="ed-balk" id="balk" hidden>
  <b id="titel"></b>
  <span class="ed-chip" id="chip"></span>
  <span class="ed-opslag" id="opslag"></span>
  <span class="ed-groei"></span>
  <button class="ed-knop" id="knopOpmaak" type="button" title="Opmaakmodus aan of uit. Aan: je ziet de blokken, kunt er een toevoegen (+), en klikt op een blok voor zijn knoppen (verplaatsen, breedte, verwijderen, instellingen). Uit: alleen het document, om rustig in te typen.">🧩 Opmaak</button>
  <button class="ed-knop" id="knopBoom" type="button" title="Het paneel met de calculatie tonen of verbergen; daaruit sleep je een deel naar het document">🧮 Calculatie</button>
  <button class="ed-knop" id="knopVelden" type="button" title="Velden die in een tekst of kop worden ingevuld, zoals {totaal}">{ } Velden</button>
  <button class="ed-knop" id="knopPdf" type="button" title="De offerte als PDF in een nieuw tabblad">📄 PDF bekijken</button>
  <button class="ed-knop" id="knopSjabloon" type="button" title="Dit document bewaren als sjabloon om een volgende offerte mee te beginnen">💾 Als sjabloon…</button>
  <button class="ed-knop" id="knopWis" type="button" title="Dit document wissen en opnieuw beginnen">🗑 Wissen…</button>
  <button class="ed-knop hoofd" id="knopVast" type="button"></button>
  <div class="ed-velden" id="velden"></div>
  <div class="ed-velden" id="sjabloon">
    Bewaar dit document als sjabloon: <input type="text" id="sjabloonNaam" maxlength="100" placeholder="Naam, bijvoorbeeld Machine met installatie">
    <label><input type="checkbox" id="sjabloonAlle"> voor alle BV's <span id="sjabloonBv"></span></label>
    <button class="ed-knop hoofd" id="sjabloonBewaar" type="button">Bewaren</button>
    <span>Een prijstabel van een deel wordt in het sjabloon een prijstabel van de hele calculatie.</span>
  </div>
</div>
<div id="meldingen"></div>
<div id="inhoud"></div>
<input type="file" id="kiesPlaatje" accept="image/png,image/jpeg,image/gif,image/webp" hidden>

<script>
(() => {
  'use strict';
  const OFFERTE = Number(new URLSearchParams(location.search).get('offerte'));
  const API = `offertedocument/api/${OFFERTE}`;
  const $ = id => document.getElementById(id);
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const euro = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' });

  let INFO = {}, MAG = false, versie = 0, status = 0, doc = { blokken: [] }, W = { blokken: {}, kop: '', slot: '', problemen: [] };
  let GROEPEN = [], VELDEN = [], VERSCHIL = null, CALC = false, SJABLONEN = [], SJABLOONTABEL = false;
  /** Het paneel met de calculatie open? Onthouden per browser; de eerste keer open als er ruimte is. */
  /** Opmaakmodus: de blokken met hun knoppen tonen. Onthouden per browser; standaard uit (rustig typen). */
  let opmaak = (() => { try { return localStorage.getItem('mde-offdoc-opmaak') === '1'; } catch (e) { return false; } })();
  /** Het blok waarop het laatst geklikt is: in de opmaakmodus toont dat blok zijn knoppen en instellingen. */
  let gekozen = null;
  let boomOpen = (() => { try { const w = localStorage.getItem('mde-offdoc-boom'); return w === null ? innerWidth >= 1100 : w === '1'; } catch (e) { return innerWidth >= 1100; } })();
  /** Wat er uit het paneel gesleept wordt: het nummer van een groep, 'heel', of null. */
  let sleepGroep = null;
  let wacht = null, bezig = false, nogEens = false, vuil = false, gestopt = false, melding = null;
  /** Alleen lezen: vastgelegd, of geen recht om te wijzigen. */
  const RO = () => !MAG || status === 1;

  const DEEL = { half: 1 / 2, derde: 1 / 3, tweederde: 2 / 3 };
  /** De cel van een eigen tabel waar de cursor het laatst stond: { id, r, k }. */
  let cel = null;
  const SOORT = { tekst: 'Tekst', kop: 'Kop', prijs: 'Prijstabel', plaatje: 'Plaatje', tabel: 'Tabel', voorwaarden: 'Voorwaarden', ondertekening: 'Ondertekening', pagina: 'Nieuwe pagina' };

  // ---------------------------------------------------------------- laden en opslaan
  function opslagStand(tekst, fout) { const el = $('opslag'); el.textContent = tekst; el.className = 'ed-opslag' + (fout ? ' fout' : ''); }
  function meld(tekst, fout) { melding = tekst ? { tekst, fout } : null; tekenMeldingen(); }

  async function vraag(tekst) {
    try { if (parent !== window && parent.mdeBevestig) return !!(await parent.mdeBevestig(tekst)); } catch (e) { }
    return confirm(tekst);
  }

  function neem(o) {
    INFO = o.info || {}; MAG = !!o.mag; CALC = !!o.calculatie; SJABLONEN = o.sjablonen || []; SJABLOONTABEL = !!o.sjabloonTabel;
    if (!o.bestaat) return;
    versie = o.versie; status = o.status;
    doc = o.data && Array.isArray(o.data.blokken) ? o.data : { blokken: [] };
    W = o.weergave || W; GROEPEN = o.groepen || []; VELDEN = o.velden || []; VERSCHIL = o.verschil || null;
    if (W.stijl) $('docstijl').textContent = W.stijl;
    opslagStand(o.gewijzigd || '');
  }

  async function laad() {
    if (!OFFERTE) throw new Error('Geen offerte opgegeven.');
    const r = await fetch(API, { headers: { Accept: 'application/json' }, cache: 'no-store' });
    const o = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(o.fout || `De app antwoordde ${r.status}.`);
    return o;
  }

  function bewaar() {
    if (RO() || gestopt) return;
    vuil = true; opslagStand('Niet opgeslagen…');
    clearTimeout(wacht); wacht = setTimeout(stuur, 800);
  }
  async function stuur() {
    clearTimeout(wacht);
    if (!vuil || gestopt) return;
    if (bezig) { nogEens = true; return; }
    bezig = true; vuil = false; opslagStand('Opslaan…');
    try {
      const r = await fetch(API, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ versie, data: doc }) });
      const o = await r.json().catch(() => ({}));
      if (r.ok) { versie = o.versie; opslagStand('Opgeslagen ' + new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })); }
      else {
        if ([403, 404, 409].includes(r.status)) gestopt = true; else vuil = true;
        opslagStand('Niet opgeslagen', true);
        meld(o.fout || `Opslaan mislukt (${r.status}).`, true);
      }
    } catch (e) {
      vuil = true; opslagStand('Niet opgeslagen: geen verbinding, opnieuw over 5 s', true);
      setTimeout(stuur, 5000);
    } finally {
      bezig = false;
      if (nogEens) { nogEens = false; vuil = true; stuur(); }
    }
  }
  /** Wacht tot alles opgeslagen is (vóór de PDF en het vastleggen). */
  async function alles() {
    for (let i = 0; i < 150 && !gestopt && (vuil || bezig); i++) {
      if (vuil && !bezig) await stuur(); else await new Promise(k => setTimeout(k, 100));
    }
    return !gestopt && !vuil && !bezig;
  }
  addEventListener('pagehide', () => {
    if (!vuil || gestopt || bezig) return;
    try { fetch(API, { method: 'PUT', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ versie, data: doc }) }); } catch (e) { }
  });

  /** De gekoppelde blokken opnieuw laten opmaken (na een keuze in een prijstabel, en als je terugkomt van de calculatie). */
  let ververst = 0, verversBezig = false, verversNog = false;
  async function ververs() {
    if (status === 1) return;
    if (verversBezig) { verversNog = true; return; }   // er is intussen weer iets gekozen: daarna nog een keer
    verversBezig = true; ververst = Date.now();
    try {
      // plaatjes hoeven niet mee: die tekent dit scherm zelf
      const licht = { blokken: doc.blokken.filter(b => b.soort !== 'plaatje') };
      const r = await fetch(`${API}/weergave`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: licht }) });
      const o = await r.json().catch(() => ({}));
      if (!r.ok) { meld(o.fout || `Opmaken mislukt (${r.status}).`, true); return; }
      W = { ...W, kop: o.kop, slot: o.slot, blokken: o.blokken || {}, problemen: o.problemen || [] };
      if (o.groepen) { GROEPEN = o.groepen; const paneel = document.querySelector('.ed-boom'); if (paneel) paneel.outerHTML = tekenBoom(); }
      document.querySelectorAll('.ed-blok').forEach(el => {
        const b = blok(el.dataset.id);
        if (b && ['prijs', 'voorwaarden', 'ondertekening'].includes(b.soort)) el.querySelector('.ed-inhoud').innerHTML = W.blokken[b.id] || '';
      });
      const kop = document.querySelector('.ed-vast[data-deel="kop"]'); if (kop) kop.innerHTML = W.kop || '';
      const slot = document.querySelector('.ed-vast[data-deel="slot"]'); if (slot) slot.innerHTML = W.slot || '';
      tekenMeldingen();
    } catch (e) { /* geen verbinding: het oude beeld blijft staan */ }
    finally { verversBezig = false; if (verversNog) { verversNog = false; ververs(); } }
  }
  addEventListener('focus', () => { if (doc.blokken.length && Date.now() - ververst > 3000) ververs(); });

  // ---------------------------------------------------------------- blokken
  const blok = id => doc.blokken.find(b => b.id === id);
  /** Het blok waarna iets "onderaan" komt: het laatste, maar boven de ondertekening als die het document afsluit. */
  function onderaan() {
    let i = doc.blokken.length;
    while (i > 0 && doc.blokken[i - 1].soort === 'ondertekening') i--;
    return i > 0 ? doc.blokken[i - 1].id : null;
  }
  const nieuwId = () => { let id; do id = 'b' + Math.random().toString(36).slice(2, 10); while (blok(id)); return id; };

  function voegToe(soort, naId, extra) {
    const b = { id: nieuwId(), soort, ...(extra || {}) };
    gekozen = b.id;
    if (soort === 'tekst') b.html = b.html ?? '';
    if (soort === 'kop') b.tekst = b.tekst ?? '';
    if (soort === 'prijs') Object.assign(b, { diepte: 1, regels: 'geen', aantallen: true, uren: false, ...extra });
    if (soort === 'tabel') Object.assign(b, { rijen: [['', '', ''], ['', '', ''], ['', '', '']], kop: true, rechts: [], ...extra });
    const i = naId ? doc.blokken.findIndex(x => x.id === naId) + 1 : 0;
    doc.blokken.splice(i, 0, b);
    bewaar(); teken();
    if (['prijs', 'voorwaarden', 'ondertekening'].includes(soort)) ververs();
    const el = document.querySelector(`.ed-blok[data-id="${b.id}"] [contenteditable]`);
    if (el) el.focus();
    return b;
  }
  function verplaats(id, naar) {   // naar = index in de lijst zonder het blok zelf
    const i = doc.blokken.findIndex(b => b.id === id); if (i < 0) return;
    const [b] = doc.blokken.splice(i, 1);
    doc.blokken.splice(Math.max(0, Math.min(naar, doc.blokken.length)), 0, b);
    bewaar(); teken();
  }

  /** Een plaatje verkleinen (hooguit 1600 px breed) en als data-URI teruggeven. */
  function leesPlaatje(bestand) {
    return new Promise((klaar, mis) => {
      const lezer = new FileReader();
      lezer.onerror = () => mis(new Error('Het bestand is niet te lezen.'));
      lezer.onload = () => {
        const img = new Image();
        img.onerror = () => mis(new Error('Dit is geen plaatje dat de browser kan tonen.'));
        img.onload = () => {
          const f = Math.min(1, 1600 / img.naturalWidth);
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * f)); c.height = Math.max(1, Math.round(img.naturalHeight * f));
          const g = c.getContext('2d');
          if (bestand.type === 'image/png') {   // een kleine png (logo, schema) blijft png, met doorzichtigheid
            g.drawImage(img, 0, 0, c.width, c.height);
            const png = c.toDataURL('image/png');
            if (png.length < 700000) { klaar(png); return; }
          }
          g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
          klaar(c.toDataURL('image/jpeg', 0.85));
        };
        img.src = lezer.result;
      };
      lezer.readAsDataURL(bestand);
    });
  }
  async function plaatjeErbij(bestand, naId) {
    try {
      const src = await leesPlaatje(bestand);
      if (src.length > 3900000) { meld('Dit plaatje is te groot, ook na verkleinen.', true); return; }
      voegToe('plaatje', naId, { src, breedte: 60, onderschrift: '' });
    } catch (e) { meld(e.message, true); }
  }

    const strip = ro ? '' : `<div class="ed-strip"><span class="ed-greep" draggable="true" title="Slepen om te verplaatsen">⠿</span><span class="ed-soort">${SOORT[b.soort] || ''}</span>${extra}<button type="button" data-actie="op" title="Omhoog">↑</button><button type="button" data-actie="neer" title="Omlaag">↓</button><button type="button" data-actie="weg" title="Blok verwijderen">✕</button></div>`;
    return `<div class="ed-blok ${DEEL[b.deel] ? 'doc-' + b.deel : ''} ${b.id === gekozen ? 'ed-gekozen' : ''}" data-id="${b.id}" data-soort="${b.soort}">${strip}${inst}<div class="ed-inhoud">${binnen}</div></div>`;

  /** Het paneel met de delen van de calculatie: slepen naar het vel geeft een prijstabel van dat deel. */
  function tekenBoom() {
    if (RO() || !boomOpen) return '';
    const tip = 'Sleep naar het document voor een prijstabel van dit deel; dubbelklik zet hem onderaan';
    const items = GROEPEN.map(g => `<div class="ed-boom-item" draggable="true" data-groep="${g.id}" style="padding-left:${6 + g.diepte * 12}px" title="${tip}"><span class="ed-boom-naam">${esc(g.naam)}</span><span class="ed-boom-bedrag">${esc(euro.format(g.verkoop))}</span></div>`).join('');

  }
  /** Een prijstabel van een deel uit het paneel: een deel zonder delen eronder toont zijn regels, anders één niveau. */
  function prijsVan(groep, naId) {
    if (groep === 'heel') return voegToe('prijs', naId);
    const id = Number(groep), i = GROEPEN.findIndex(g => g.id === id);
    const blad = i < 0 || !(GROEPEN[i + 1] && GROEPEN[i + 1].diepte > GROEPEN[i].diepte);
    return voegToe('prijs', naId, { groep: id, regels: blad ? 'omschrijving' : 'geen' });
  }
  function teken() {
    const ro = RO();
    const delen = [`<div class="ed-vast" data-deel="kop">${W.kop || ''}</div>`, tussen(null)];
    // blokken die niet de hele breedte nemen staan naast elkaar zolang ze samen op één regel passen (zoals de PDF)
    let rij = [], som = 0;
    const sluit = () => { if (!rij.length) return; delen.push(`<div class="doc-rij">${rij.map(tekenBlok).join('')}</div>`, tussen(rij.at(-1).id)); rij = []; som = 0; };
    for (const b of doc.blokken) {
      const breedte = DEEL[b.deel] || 1;
      if (breedte >= 1) { sluit(); delen.push(tekenBlok(b), tussen(b.id)); continue; }
      if (som + breedte > 1.001) sluit();
      rij.push(b); som += breedte;
    }
    sluit();
    delen.push(`<div class="ed-vast" data-deel="slot">${W.slot || ''}</div>`);
    const schuif = document.querySelector('.ed-schuif')?.scrollTop ?? 0;
    $('inhoud').innerHTML = `<div class="ed-werk">${tekenBoom()}<div class="ed-schuif"><div class="ed-blad ${ro ? '' : 'ed-bewerk'} ${!ro && opmaak ? 'ed-opmaak' : ''}" id="blad">${delen.join('')}</div></div></div>`;

  inhoud.addEventListener('keydown', e => {

  inhoud.addEventListener('focusin', e => {
    if (e.target.matches && e.target.matches('.eigen td, .eigen th')) cel = { id: e.target.closest('.ed-blok').dataset.id, r: Number(e.target.dataset.r), k: Number(e.target.dataset.k) };

  // plakken: altijd als platte tekst (geen opmaak uit Word of het web); een plaatje wordt een eigen blok
  // (op het hele scherm: een plaatje plakken werkt ook als de cursor niet in een blok staat; het komt dan onderaan)
  document.addEventListener('paste', e => {
    if (RO()) return;
    const el = e.target.closest ? e.target.closest('.ed-blok') : null;
    const img = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
    if (img) { e.preventDefault(); plaatjeErbij(img, el ? el.dataset.id : onderaan()); return; }

    e.preventDefault();
    // cellen uit Excel (tabs en regels) in een eigen tabel: vanaf de cel van de cursor invullen, de tabel groeit mee
    const tc = e.target.closest('.eigen td, .eigen th'), plat = (e.clipboardData?.getData('text/plain') || '').replace(/\r/g, '');
    if (tc && /[\t\n]/.test(plat.replace(/\n+$/, ''))) {
      const b = blok(el.dataset.id), r0 = Number(tc.dataset.r), k0 = Number(tc.dataset.k);
      const bron = plat.replace(/\n+$/, '').split('\n').map(x => x.split('\t'));
      const kolommen = Math.min(8, Math.max(b.rijen[0].length, k0 + Math.max(...bron.map(x => x.length))));
      while (b.rijen.length < Math.min(100, r0 + bron.length)) b.rijen.push([]);
      b.rijen.forEach(rij => { while (rij.length < kolommen) rij.push(''); });
      bron.forEach((rij, i) => rij.forEach((c, k) => { if (r0 + i < b.rijen.length && k0 + k < kolommen) b.rijen[r0 + i][k0 + k] = c.trim(); }));

      if (nu) cel = { id: b.id, r: Number(nu.dataset.r), k: Number(nu.dataset.k) };
      const hier = cel && cel.id === b.id && cel.r < b.rijen.length && cel.k < b.rijen[0].length ? cel : { r: b.rijen.length - 1, k: b.rijen[0].length - 1 };
      let { r, k } = hier;
      if (wat === 'rij+') { if (b.rijen.length >= 100) return; b.rijen.splice(r + 1, 0, b.rijen[0].map(() => '')); r++; }
      else if (wat === 'kol+') { if (b.rijen[0].length >= 8) { meld('Een tabel heeft hooguit 8 kolommen.', false); return; } b.rijen.forEach(rij => rij.splice(k + 1, 0, '')); b.rechts = (b.rechts || []).map(x => x > k ? x + 1 : x); k++; }
      else if (wat === 'rij-') { if (b.rijen.length <= 1) return; b.rijen.splice(r, 1); r = Math.min(r, b.rijen.length - 1); }
      else if (wat === 'kol-') { if (b.rijen[0].length <= 1) return; b.rijen.forEach(rij => rij.splice(k, 1)); b.rechts = (b.rechts || []).filter(x => x !== k).map(x => x > k ? x - 1 : x); k = Math.min(k, b.rijen[0].length - 1); }
      else if (wat === 'kop') b.kop = !b.kop;
      else if (wat === 'rechts') b.rechts = (b.rechts || []).includes(k) ? b.rechts.filter(x => x !== k) : [...(b.rechts || []), k];
      bewaar(); teken(); focusCel(b.id, r, k);
      return;
    }
    const actie = e.target.closest('[data-actie]');
    if (actie) {
      const id = actie.closest('.ed-blok').dataset.id, i = doc.blokken.findIndex(b => b.id === id), b = doc.blokken[i];
      if (actie.dataset.actie === 'op' && i > 0) verplaats(id, i - 1);
      else if (actie.dataset.actie === 'neer' && i < doc.blokken.length - 1) verplaats(id, i + 1);
      else if (actie.dataset.actie === 'weg') {
        const leeg = (b.soort === 'tekst' && !b.html) || (b.soort === 'kop' && !b.tekst) || b.soort === 'pagina';
        if (leeg || await vraag(`Dit blok (${SOORT[b.soort].toLowerCase()}) verwijderen?`)) { doc.blokken.splice(i, 1); bewaar(); teken(); }
      }
      return;
    }
    const plus = e.target.closest('.ed-tussen > button');
    // eerst uitlezen wat er in het menu gekozen is: het menu gaat hierna weg
    const nieuw = e.target.closest('[data-nieuw]'), nieuwNa = nieuw ? (nieuw.closest('.ed-tussen').dataset.na || null) : null;
    document.querySelectorAll('.ed-menu').forEach(m => { m.parentElement.classList.remove('ed-menu-open'); m.remove(); });
    if (plus) {
      const zone = plus.parentElement;
      zone.classList.add('ed-menu-open');
      zone.insertAdjacentHTML('beforeend', `<div class="ed-menu">${[['tekst', '¶ Tekst'], ['kop', 'Kop'], ['prijs', '🔗 Prijstabel uit de calculatie'], ['plaatje', '🖼 Plaatje'], ['tabel', '▦ Eigen tabel'],
        ['voorwaarden', '🔗 Voorwaarden'], ['ondertekening', '🔗 Ondertekening'], ['pagina', '⤓ Nieuwe pagina']].map(([s, t]) => `<button type="button" data-nieuw="${s}">${t}</button>`).join('')}</div>`);
      return;
    }
    if (nieuw) {
      if (nieuw.dataset.nieuw === 'plaatje') { plaatjeNa = nieuwNa; $('kiesPlaatje').click(); }
      else voegToe(nieuw.dataset.nieuw, nieuwNa);
    }
  });

  // slepen: met de greep, of een plaatje uit de verkenner op het vel
  let sleep = null;
  const plek = e => {
    const el = e.target.closest ? e.target.closest('.ed-blok') : null;
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { el, id: el.dataset.id, voor: e.clientY < r.top + r.height / 2 };
  };
  const wisAanwijzers = () => document.querySelectorAll('.ed-voor, .ed-na').forEach(x => x.classList.remove('ed-voor', 'ed-na'));
  inhoud.addEventListener('dragstart', e => {
    const uitBoom = e.target.closest ? e.target.closest('.ed-boom-item') : null;
    if (uitBoom && !RO()) {
      sleepGroep = uitBoom.dataset.groep;
      e.dataTransfer.effectAllowed = 'copy'; e.dataTransfer.setData('text/plain', uitBoom.textContent);
      return;
    }
    const greep = e.target.closest ? e.target.closest('.ed-greep') : null;
    if (!greep || RO()) { e.preventDefault(); return; }
    const el = greep.closest('.ed-blok');
    sleep = el.dataset.id; el.classList.add('ed-sleep');
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', sleep);
    try { e.dataTransfer.setDragImage(el, 20, 10); } catch (x) { }
  });
  inhoud.addEventListener('dragover', e => {
    if (RO()) return;
    const bestand = !sleep && [...(e.dataTransfer?.types || [])].includes('Files');
    if (!sleep && !bestand && sleepGroep === null) return;
    if (sleepGroep !== null && !(e.target.closest && e.target.closest('.ed-blad'))) return;   // alleen op het vel
    e.preventDefault(); wisAanwijzers();
    const p = plek(e);
    if (sleepGroep !== null) $('blad').classList.toggle('ed-doel', !p);
    if (p && p.id !== sleep) p.el.classList.add(p.voor ? 'ed-voor' : 'ed-na');
  });
  inhoud.addEventListener('drop', e => {
    if (RO()) return;
    const p = plek(e); wisAanwijzers();
    if (sleepGroep !== null) {
      // een deel uit het paneel: voor of na het blok waar je loslaat; naast de blokken = onderaan
      e.preventDefault();
      const groep = sleepGroep; sleepGroep = null;
      if (!(e.target.closest && e.target.closest('.ed-blad'))) return;
      let na = doc.blokken.at(-1)?.id ?? null;
      if (p) { const i = doc.blokken.findIndex(b => b.id === p.id); na = p.voor ? (i > 0 ? doc.blokken[i - 1].id : null) : p.id; }
      prijsVan(groep, na);
      return;
    }
    const bestand = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
    if (!sleep && bestand) {
      e.preventDefault();
      let na = doc.blokken.at(-1)?.id ?? null;
      if (p) { const i = doc.blokken.findIndex(b => b.id === p.id); na = p.voor ? (i > 0 ? doc.blokken[i - 1].id : null) : p.id; }
      plaatjeErbij(bestand, na);
      return;
    }
    if (!sleep) return;
    e.preventDefault();
    const id = sleep; sleep = null;
    if (!p || p.id === id) { teken(); return; }
    const zonder = doc.blokken.filter(b => b.id !== id);
    const i = zonder.findIndex(b => b.id === p.id);
    verplaats(id, p.voor ? i : i + 1);
  });
  inhoud.addEventListener('dragend', () => { sleep = null; sleepGroep = null; document.querySelectorAll('.ed-doel').forEach(x => x.classList.remove('ed-doel')); wisAanwijzers(); document.querySelectorAll('.ed-sleep').forEach(x => x.classList.remove('ed-sleep')); });

  // de balk
  $('knopVelden').addEventListener('click', () => { $('sjabloon').classList.remove('open'); $('velden').classList.toggle('open'); });
  $('knopOpmaak').addEventListener('click', () => {
    opmaak = !opmaak;
    try { localStorage.setItem('mde-offdoc-opmaak', opmaak ? '1' : '0'); } catch (e) { }
    document.querySelectorAll('.ed-menu').forEach(m => { m.parentElement.classList.remove('ed-menu-open'); m.remove(); });
    $('blad')?.classList.toggle('ed-opmaak', opmaak && !RO());
    $('knopOpmaak').classList.toggle('aan', opmaak);
  });
  // het blok waarop je klikt (of waarin je typt) is het gekozen blok; klik je naast de blokken, dan is er geen gekozen
  function kies(id) {
    if (gekozen === id) return;
    gekozen = id;
    document.querySelectorAll('.ed-blok.ed-gekozen').forEach(x => x.classList.remove('ed-gekozen'));
    if (id) document.querySelector(`.ed-blok[data-id="${id}"]`)?.classList.add('ed-gekozen');
  }
  inhoud.addEventListener('mousedown', e => {
    if (!e.target.closest || !e.target.closest('.ed-blad')) return;
    const el = e.target.closest('.ed-blok');
    if (el) kies(el.dataset.id); else if (!e.target.closest('.ed-tussen')) kies(null);
  });
  inhoud.addEventListener('focusin', e => { const el = e.target.closest ? e.target.closest('.ed-blok') : null; if (el) kies(el.dataset.id); });
  $('knopBoom').addEventListener('click', () => {
    boomOpen = !boomOpen;
    try { localStorage.setItem('mde-offdoc-boom', boomOpen ? '1' : '0'); } catch (e) { }
    teken();
  });
  // dubbelklik in het paneel: de prijstabel onderaan, maar boven de ondertekening als die het laatste blok is
  inhoud.addEventListener('dblclick', e => {
    const item = e.target.closest ? e.target.closest('.ed-boom-item') : null;
    if (!item || RO()) return;
    prijsVan(item.dataset.groep, onderaan());
  });
  $('knopSjabloon').addEventListener('click', () => {
    $('velden').classList.remove('open');
    if ($('sjabloon').classList.toggle('open')) { if (!$('sjabloonNaam').value) $('sjabloonNaam').value = INFO.offerte || ''; $('sjabloonNaam').focus(); $('sjabloonNaam').select(); }
  });
  async function bewaarSjabloon(vervang) {
    const naam = $('sjabloonNaam').value.trim();
    if (!naam) { meld('Geef het sjabloon een naam.', true); return; }
    if (!RO() && !await alles()) { meld('Eerst moet alles opgeslagen zijn; dat lukte niet.', true); return; }
    try {
      const r = await fetch(`${API}/sjabloon`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ naam, alleBvs: $('sjabloonAlle').checked, vervang: !!vervang }) });
      const o = await r.json().catch(() => ({}));
      if (r.status === 409 && o.bestaat && !vervang) {
        if (await vraag(`Er is al een sjabloon "${naam}". Vervangen door dit document?`)) await bewaarSjabloon(true);
        return;
      }
      if (!r.ok) { meld(o.fout || `Bewaren mislukt (${r.status}).`, true); return; }
      $('sjabloon').classList.remove('open');
      meld(`Sjabloon "${naam}" is bewaard. Je kunt ermee beginnen bij een offerte die nog geen document heeft.`, false);
    } catch (e) { meld('Geen verbinding met de app.', true); }
  }
  $('sjabloonBewaar').addEventListener('click', () => bewaarSjabloon(false));
  $('sjabloonNaam').addEventListener('keydown', e => { if (e.key === 'Enter') bewaarSjabloon(false); });
  // een sjabloon wissen (in de keuze bij een offerte zonder document)
  inhoud.addEventListener('click', async e => {
    const wis = e.target.closest ? e.target.closest('[data-wis-sjabloon]') : null;
    if (!wis) return;
    e.preventDefault();
    const s = SJABLONEN.find(x => String(x.id) === wis.dataset.wisSjabloon);
    if (!s || !await vraag(`Sjabloon "${s.naam}" wissen? Documenten die ermee gemaakt zijn blijven zoals ze zijn.`)) return;
    const r = await fetch(`offertedocument/api/sjablonen/${s.id}/wis`, { method: 'POST' });
    if (!r.ok) { const o = await r.json().catch(() => ({})); meld(o.fout || `Wissen mislukt (${r.status}).`, true); return; }
    await begin();
  });
  $('velden').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  $('velden').addEventListener('click', e => {
    const k = e.target.closest('[data-veld]'); if (!k) return;
    const el = document.activeElement;
    if (!el || !el.isContentEditable || !el.matches('.doc-tekst, .doc-kop')) { meld('Zet eerst de cursor in een tekst of kop.', false); return; }
    document.execCommand('insertText', false, k.dataset.veld);
  });
  $('knopPdf').addEventListener('click', async () => {
    if (!RO() && !await alles()) { meld('Eerst moet alles opgeslagen zijn; dat lukte niet.', true); return; }
    open(`${API}/pdf?t=${Date.now()}`, '_blank', 'noopener');
  });
  $('knopWis').addEventListener('click', async () => {
    if (!await vraag('Het hele document wissen? Je teksten en plaatjes zijn dan weg; de calculatie en de offerte blijven zoals ze zijn.')) return;
    gestopt = true; clearTimeout(wacht);
    const r = await fetch(`${API}/wis`, { method: 'POST' });
    const o = await r.json().catch(() => ({}));
    if (!r.ok) { gestopt = false; meld(o.fout || `Wissen mislukt (${r.status}).`, true); return; }
    await begin();
  });
  $('knopVast').addEventListener('click', async () => {
    const vast = status === 1;
    if (vast && !await vraag('Het document weer bewerkbaar maken? De prijstabellen nemen dan de cijfers over die nu in de calculatie staan.')) return;
    if (!vast && !await alles()) { meld('Eerst moet alles opgeslagen zijn; dat lukte niet.', true); return; }
    $('knopVast').disabled = true;
    try {
      const r = await fetch(`${API}/${vast ? 'vrijgeven' : 'vastleggen'}`, { method: 'POST' });
      const o = await r.json().catch(() => ({}));
      if (!r.ok) { meld(o.fout || `Mislukt (${r.status}).`, true); return; }
      await begin();
      meld(vast ? 'Het document is weer te bewerken en volgt de calculatie.' : 'Vastgelegd met de cijfers van nu. Een wijziging in de calculatie verandert dit document niet meer.', false);
    } catch (e) { meld('Geen verbinding met de app.', true); }
    finally { $('knopVast').disabled = false; }
  });

  /** Licht of donker zoals de app (html[data-thema] van het venster eromheen). */
  function thema() {
    const zet = () => {
      let donker;
      try { donker = parent.document.documentElement.getAttribute('data-thema') === 'donker'; }
      catch (e) { donker = matchMedia('(prefers-color-scheme: dark)').matches; }
      document.documentElement.dataset.theme = donker ? 'dark' : 'light';
    };
    zet();
    try { new MutationObserver(zet).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-thema'] }); } catch (e) { }
  }

  async function begin() {
    gestopt = false; vuil = false; melding = null;
    try {
      const o = await laad();
      neem(o);
      if (o.bestaat) teken(); else tekenLeeg(o);
    } catch (e) {
      $('balk').hidden = true;
      $('inhoud').innerHTML = `<div class="ed-leeg"><h2>Offertedocument</h2><p>${esc(e.message)}</p></div>`;
    }
  }
  thema();
  begin();
})();
</script>
</body>
